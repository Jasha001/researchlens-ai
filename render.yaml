# Public access: visitors verify with Turnstile; no invite code.
# Deploy this repository as a Blueprint. Only a free web service is defined.
# DATABASE_URL must come from a separate Neon FREE project, not Render's expiring free database.
services:
  - type: web
    name: researchlens-beta
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PUBLIC_MODE
        value: 'true'
      - key: BETA_INVITE_ONLY
        value: 'false'
      - key: FREE_HOST_MODE
        value: 'true'
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_ACCESS_CODE
        value: ''
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: PRIVACY_CONTACT
        sync: false
      - key: MAX_AI_REQUESTS_PER_DAY
        value: '60'
      - key: MAX_AI_REQUESTS_PER_SESSION_DAY
        value: '10'
      - key: AI_SUPPORT_REVIEW
        value: 'true'
      - key: AI_MAX_OUTPUT_TOKENS
        value: '1600'
