services:
  researchlens:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8182:8182"
    volumes:
      - limits:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 96
    restart: unless-stopped
volumes:
  limits:
