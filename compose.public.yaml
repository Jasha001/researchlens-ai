# Requires Docker Compose >=2.30 (raw env_file). No services start until you run Compose.
services:
  researchlens:
    build: .
    env_file:
      - path: .env.public
        format: raw
    expose: ["8182"]
    volumes: ["limits:/data"]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 96
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8182/health',headers={'Host':os.environ['PUBLIC_HOST']}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  proxy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Supply PUBLIC_HOST using --env-file .env.public}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on:
      researchlens:
        condition: service_healthy
    restart: unless-stopped
volumes:
  limits:
  caddy_data:
  caddy_config:
